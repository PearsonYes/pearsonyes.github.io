<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chapter 3 - YouShouYan (有兽焉)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col justify-between">

  <!-- Top Navigation Bar -->
  <header class="bg-white/90 backdrop-blur-md border-b border-amber-100 sticky top-0 z-50 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-4">
        <a href="index.html" class="bg-amber-100 hover:bg-amber-200 text-amber-900 text-xs font-bold px-3 py-2 rounded-xl transition">&larr; <span data-i18n="backHome">Home</span></a>
        <div>
          <h1 class="text-sm font-bold text-amber-900">Capitolo 3</h1>
          <p class="text-xs text-gray-500">YouShouYan (有兽焉)</p>
        </div>
      </div>

      <div class="flex items-center space-x-3">
        <!-- Dynamic Language Switcher -->
        <div class="flex items-center space-x-1.5">
          <span class="text-xs font-semibold text-gray-500">Lang:</span>
          <select id="langSelect" onchange="switchLanguage(this.value)" class="bg-amber-50 border border-amber-200 text-amber-900 text-xs rounded-lg px-2.5 py-1.5 font-medium cursor-pointer focus:outline-none focus:ring-2 focus:ring-amber-400">
            <option value="it">IT</option>
            <option value="en">EN</option>
          </select>
        </div>

        <a href="ch2.html" class="bg-amber-100 hover:bg-amber-200 text-amber-900 text-xs font-bold px-3 py-2 rounded-xl transition flex items-center space-x-1">
          &larr; <span data-i18n="prevChapter">Prev</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Long Strip Image Container -->
  <main class="flex-grow py-6 px-2 sm:px-4">
    <div class="reader-container rounded-2xl overflow-hidden">
      <!-- 
        Dynamic Image Source: 
        Update the paths below to point to your Chapter 3 image folder/files.
      -->
      <img id="chapterImage" 
           src="cap 3 -- LUNGO VIAGGIO/cap3.png" 
           alt="SORRY! Not out yet! (in YOUR language)" 
           class="long-strip-image">
    </div>
  </main>

  <!-- Bottom Navigation Bar -->
  <footer class="bg-white border-t border-amber-100 py-4 text-center">
    <div class="max-w-4xl mx-auto px-4 flex justify-between items-center text-xs text-gray-600">
      <a href="ch2.html" class="hover:text-amber-700 font-medium">&larr; <span data-i18n="prevChapter">Previous Chapter</span></a>
      <p>© YouShouYan Translation Project</p>
      <a href="index.html" class="hover:text-amber-700 font-medium"><span data-i18n="backHome">Home</span></a>
    </div>
  </footer>

  <!-- Script for Language Switch & Dynamic Image Swapping -->
  <script>
    // Define image paths for different languages for Chapter 3
    const chapterImages = {
      it: "cap 3 -- LUNGO VIAGGIO/cap3.png", // Change to your actual Italian image path for Chapter 3
      en: "cap 3 -- LUNGO VIAGGIO/cap3_en.png"  // Change to your actual English image path for Chapter 3
    };

    const translations = {
      it: { backHome: "Home", prevChapter: "Precedente", nextChapter: "Prossimo Capitolo" },
      en: { backHome: "Home", prevChapter: "Prev", nextChapter: "Next Chapter" }
    };

    function switchLanguage(lang) {
      localStorage.setItem('ysy_lang', lang);
      
      // Update image source based on selected language
      const imgEl = document.getElementById('chapterImage');
      if (chapterImages[lang]) {
        imgEl.src = chapterImages[lang];
      }

      // Update UI text translations
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang] && translations[lang][key]) {
          el.innerText = translations[lang][key];
        }
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      const savedLang = localStorage.getItem('ysy_lang') || 'it';
      document.getElementById('langSelect').value = savedLang;
      switchLanguage(savedLang);
    });
  </script>
</body>
</html>
